<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Ange 3D — Ledgend Village</title><style>body{margin:0;background:#172434;color:white;font:15px system-ui;overflow:hidden;touch-action:none}#ui{position:fixed;top:12px;left:12px;background:#152532d9;padding:12px;border-radius:12px;max-width:82vw}button{border:0;border-radius:8px;background:#f2d88d;padding:11px;margin:4px;font-weight:bold}</style><div id=ui><b>Ledgend Village — Ange 3D</b><p>Glisse pour tourner autour du personnage.</p><button id=wings>Ailes</button><button id=spell>Bouclier céleste</button><p id=message>Prévisualisation indépendante du jeu principal.</p></div><script type=module>import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const s=new T.Scene();s.background=new T.Color(0x85abc7);let cam=new T.PerspectiveCamera(47,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x62687a,2.4));let lamp=new T.DirectionalLight(0xffe7b3,3);lamp.position.set(-5,11,7);s.add(lamp);const m=c=>new T.MeshStandardMaterial({color:c,roughness:.7,side:T.DoubleSide}),skin=m(0xc99577),ivory=m(0xf7f4eb),shade=m(0xd5dbe3),gold=m(0xe4c276),cloth=m(0xe7ded3),hair=m(0x624a40),dark=m(0x333541);function mesh(g,mat,parent,x,y,z){let o=new T.Mesh(g,mat);o.position.set(x,y,z);parent.add(o);return o}function oval(p,mat,x,y,z,a,b,c){let o=mesh(new T.SphereGeometry(1,16,12),mat,p,x,y,z);o.scale.set(a,b,c);return o}mesh(new T.CylinderGeometry(6,6,.2,32),m(0x69947c),s,0,-.2,0);let a=new T.Group();s.add(a);oval(a,cloth,0,1.75,0,.51,.79,.34);let skirt=mesh(new T.ConeGeometry(.84,1.7,16),cloth,a,0,.86,0);skirt.rotation.z=Math.PI;for(let side of [-1,1]){oval(a,cloth,side*.51,1.57,.02,.24,.59,.23);oval(a,skin,side*.66,1.17,.07,.14,.18,.13);oval(a,shade,side*.26,.28,.06,.26,.4,.29);oval(a,skin,side*.15,2.87,.34,.09,.07,.03);oval(a,dark,side*.15,2.88,.368,.035,.04,.016);oval(a,hair,side*.28,2.87,-.09,.14,.36,.27)}oval(a,skin,0,2.51,0,.2,.25,.2);oval(a,skin,0,2.88,.02,.36,.46,.36);oval(a,hair,0,3.19,-.08,.4,.23,.37);oval(a,skin,0,2.71,.35,.07,.08,.07);oval(a,m(0xa3646a),0,2.59,.33,.12,.018,.015);let halo=mesh(new T.TorusGeometry(.44,.025,7,48),gold,a,0,3.55,0);halo.rotation.x=.14;let wings=[];for(let side of [-1,1]){let w=new T.Group();w.position.set(side*.4,2.1,-.31);a.add(w);wings.push(w);oval(w,shade,side*.64,.25,0,.78,.43,.18).rotation.z=-side*.34;for(let row=0;row<3;row++)for(let i=0;i<12;i++){let t=i/11;let f=oval(w,row===2?ivory:row===1?shade:cloth,side*(.22+t*(1.2+row*.36)),.45-row*.25-t*.72,-.04-row*.055,.11+row*.015,.29+row*.12+t*.2,.05);f.rotation.z=-side*(.15+t*.55)}}const shield=mesh(new T.SphereGeometry(2.9,20,14),new T.MeshBasicMaterial({color:0xa6dfff,transparent:true,opacity:.16,side:T.DoubleSide,depthWrite:false}),s,0,1.8,0);shield.visible=false;let az=.35,dist=8,opened=false,time=0;function camera(){cam.position.set(Math.sin(az)*dist,4,Math.cos(az)*dist);cam.lookAt(0,1.8,0)}camera();let px=null;r.domElement.onpointerdown=e=>{r.domElement.setPointerCapture(e.pointerId);px=e.clientX};r.domElement.onpointermove=e=>{if(px===null)return;az+=(px-e.clientX)*.01;px=e.clientX;camera()};r.domElement.onpointerup=()=>px=null;document.getElementById('wings').onclick=()=>{opened=!opened;document.getElementById('message').textContent=opened?'Ailes déployées.':'Ailes repliées.'};document.getElementById('spell').onclick=()=>{time=3;shield.visible=true;document.getElementById('message').textContent='Bouclier céleste activé.'};function loop(t){requestAnimationFrame(loop);a.position.y=Math.sin(t*.0016)*.045;halo.rotation.z=t*.00015;wings.forEach((w,i)=>{let side=i?1:-1;w.rotation.y+=(side*(opened?.15:.8)-w.rotation.y)*.05;w.rotation.z=side*(opened?.38:.1)+Math.sin(t*.002)*.02});if(time>0){time-=.016;if(time<=0)shield.visible=false}r.render(s,cam)}requestAnimationFrame(loop);onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></html>
