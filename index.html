<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Village d'ODA</title><style>body{font:16px system-ui;background:#173c31;color:white;max-width:700px;margin:auto;padding:14px}button{padding:12px;margin:4px;border:0;border-radius:8px;background:#f2c66d}section{background:#285847;padding:12px;border-radius:12px;margin:12px 0}#map{height:220px;background:#70ac65;position:relative;border-radius:12px}#map button{position:absolute;font-size:12px}small{display:block}</style><h1>🌱 Le Village d'ODA</h1><p id=stats></p><section><h2>Carte du monde</h2><div id=map><button style='left:38%;top:30%' onclick='place="Champ";draw()'>🌾 Champ</button><button style='left:3%;top:10%' onclick='place="Boisclair";draw()'>🏘️ Boisclair</button><button style='right:3%;top:10%' onclick='place="Pierreval";draw()'>🏘️ Pierreval</button><button style='left:36%;bottom:3%' onclick='place="Rivazur";draw()'>🏘️ Rivazur</button></div><p id=where></p></section><section><h2>Actions</h2><div id=actions></div><p id=msg>Utilise l'ODA pour cultiver et atteindre le niveau 5.</p></section><section><h2>Boss du village</h2><p id=boss></p><small id=list></small></section><section><h2>Commerce</h2><div id=trade></div></section><button onclick=save()>💾 Sauvegarder</button><script>const names=['Sanglier des ronces','Golem de boue','Corbeau-tempête','Serpent des récoltes','Troll du pont','Spectre des granges','Hydre des marais','Dragon des cendres','Titan des racines','Roi de la nuit'];const markets={Boisclair:['grain','wood',3],Pierreval:['wood','stone',3],Rivazur:['grain','stone',4]};const initial=()=>({lvl:1,xp:0,role:'Humain',grain:2,wood:1,stone:0,coins:5,hp:25,village:30,day:1,kills:0,enemy:0,phase:'start'});let s;try{s={...initial(),...JSON.parse(localStorage.getItem('oda-game'))}}catch{s=initial()}let place='Champ';const el=id=>document.getElementById(id);function note(t){el('msg').textContent=t}function save(){localStorage.setItem('oda-game',JSON.stringify(s));note('Partie sauvegardée sur cet appareil.')}function level(n){s.xp+=n;while(s.xp>=s.lvl*4){s.xp-=s.lvl*4;s.lvl++;s.hp=25+s.lvl*2;if(s.lvl===5){s.phase='choose';note('Niveau 5 : choisis ton évolution.');break}}}function farm(){if(s.phase==='choose'||s.phase==='battle')return;if(place!=='Champ')return note('Va au champ.');if(s.role!=='Humain')return note('Seul l’humain possède l’ODA.');let n=2+Math.floor(s.lvl/4);s.grain+=n;s.wood++;level(2);if(s.lvl>=5&&s.phase==='start')s.phase='play';note('ODA récolte '+n+' céréales et 1 bois.');draw()}function choose(r){s.role=r;s.phase='play';note(r==='Humain'?'Tu gardes l’ODA.':r==='Ange'?'Tu abandonnes l’ODA et protèges le village avec des sorts surpuissants.':'Tu abandonnes l’ODA et combats avec tes griffes.');draw()}function rest(){if(s.phase==='start')return note('Cultive d’abord jusqu’au niveau 5.');if(s.phase==='choose')return;s.day++;s.hp=Math.min(25+s.lvl*2,s.hp+4);if(s.phase==='battle'){s.village-=3;note('Le boss attaque : le village perd 3 points.')}else if(s.day%3===0&&s.kills<10){s.phase='battle';s.enemy=12+s.kills*9;note('⚠️ '+names[s.kills]+' attaque le village !')}else note('Un jour passe.');if(s.village<=0){s.village=12;s.phase='play';s.enemy=0;s.coins=Math.max(0,s.coins-5);note('Village dévasté puis reconstruit : 5 pièces perdues.')}draw()}function hit(){if(s.phase!=='battle')return note('Aucun boss à combattre.');let d=(s.role==='Ange'?13:s.role==='Loup des enfers'?10:8)+Math.floor(s.lvl/2);s.enemy=Math.max(0,s.enemy-d);if(s.role==='Ange')s.village=Math.min(45,s.village+3);if(s.role==='Humain'&&s.wood){s.wood--;s.village=Math.min(45,s.village+2)}if(s.enemy===0){let n=s.kills++;s.phase='play';s.coins+=6+n*2;s.stone++;level(4+n);note('🏆 '+names[n]+' vaincu ! Récompense : pièces et pierre.'+(s.kills===10?' Les dix boss sont vaincus !':''))}else{s.village--;note('Tu infliges '+d+' dégâts. Le village perd 1 point.')}draw()}function defend(){if(s.phase!=='battle'||s.grain<2)return note('Il faut un boss et 2 céréales pour défendre.');s.grain-=2;s.enemy=Math.max(0,s.enemy-4);s.village=Math.min(45,s.village+2);if(s.enemy===0){let n=s.kills++;s.phase='play';s.coins+=6+n*2;s.stone++;level(4+n);note('🏆 '+names[n]+' vaincu par les défenseurs !')}else note('Les habitants repoussent le boss : 4 dégâts.');draw()}function deal(t){if(s.phase==='battle'||s.phase==='choose')return note('Commerce impossible maintenant.');let m=markets[place];if(!m)return note('Choisis un village voisin sur la carte.');if(t==='sell'){if(s[m[0]]<2)return note('Il te faut 2 '+m[0]+'.');s[m[0]]-=2;s.coins+=m[2];note('Vente réussie.')}else{if(s.coins<2)return note('Il te faut 2 pièces.');s.coins-=2;s[m[1]]++;note('Achat réussi.')}draw()}function draw(){el('stats').textContent=s.role+' · Niv '+s.lvl+' ('+s.xp+'/'+s.lvl*4+' XP) · Jour '+s.day+' · ❤️ '+s.hp+' · 🏘️ '+s.village+'/45 · 🌾 '+s.grain+' · 🪵 '+s.wood+' · 🪨 '+s.stone+' · 🪙 '+s.coins;el('where').textContent='Lieu actuel : '+place;el('actions').innerHTML=s.phase==='choose'?'<button onclick=choose("Humain")>🧑 Humain + ODA</button><button onclick=choose("Ange")>🪽 Ange protecteur</button><button onclick=choose("Loup des enfers")>🐺 Loup des enfers</button>':'<button onclick=farm()>🌾 Cultiver</button><button onclick=rest()>🛏️ Jour suivant</button><button onclick=hit()>✨ Pouvoir / attaque</button><button onclick=defend()>🛡️ Défendre (2 céréales)</button>';el('boss').textContent=s.phase==='battle'?names[s.kills]+' : '+s.enemy+' PV':'Boss vaincus : '+s.kills+'/10'+(s.kills<10?' · Prochain : '+names[s.kills]:' · Victoire !');el('list').textContent=names.map((x,i)=>(i<s.kills?'✓ ':'○ ')+x).join(' · ');let m=markets[place];el('trade').innerHTML=m?'À '+place+' : vend 2 '+m[0]+' contre '+m[2]+' pièces ou achète 1 '+m[1]+' pour 2 pièces.<br><button onclick=deal("sell")>Vendre</button><button onclick=deal("buy")>Acheter</button>':'Sélectionne Boisclair, Pierreval ou Rivazur sur la carte.'}draw();</script></html>
