<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Ledgend Village 3D</title><style>body{margin:0;overflow:hidden;background:#152e2e;color:white;font:14px system-ui;touch-action:none}canvas{display:block}#hud{position:absolute;top:8px;left:8px;background:#142b26dd;padding:10px;border-radius:10px;max-width:75vw}#note{position:absolute;top:120px;left:8px;max-width:75vw;background:#163b2bc9;border-radius:8px;padding:8px}#pad{position:absolute;bottom:25px;left:18px;width:115px;height:115px;border-radius:60px;background:#ffffff40;border:2px solid #fff9;touch-action:none}#nub{position:absolute;left:38px;top:38px;width:36px;height:36px;border-radius:50%;background:#ffe4a9}#keys{position:absolute;bottom:12px;right:10px;display:grid;grid-template-columns:repeat(2,70px);gap:6px}button{min-height:58px;background:#31594b;color:#fff;border:2px solid #f7d783;border-radius:20px;font-weight:bold}#modal{position:absolute;inset:0;background:#071a14e9;display:none;align-items:center;justify-content:center;padding:20px}#card{background:#28513e;padding:20px;border-radius:14px;max-width:400px;width:100%}#card button{display:block;width:100%;margin:8px 0}</style><div id=hud></div><div id=note>Déplace-toi avec le joystick. Approche-toi du champ et presse ACTION.</div><div id=pad><div id=nub></div></div><div id=keys><button id=act>ACTION</button><button id=hit>ATTAQUE</button><button id=magic>POUVOIR</button><button id=rest>REPOS</button></div><div id=modal><div id=card></div></div><script type=module>import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';let N=['Sanglier des ronces','Golem de boue','Corbeau-tempête','Serpent des récoltes','Troll du pont','Spectre des granges','Hydre des marais','Dragon des cendres','Titan des racines','Roi de la nuit'];let towns={Boisclair:[-18,-17,'grain','wood'],Pierreval:[18,-17,'wood','stone'],Rivazur:[18,17,'grain','stone']};let init=()=>({lvl:1,xp:0,role:'Humain',chosen:false,grain:2,wood:2,stone:0,coins:5,village:100,hp:40,day:1,boss:0});let s;try{s={...init(),...JSON.parse(localStorage.getItem('ledgend-save'))}}catch{s=init()}let $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0x92c8ed);let camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,110),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x587448,2));let sun=new T.DirectionalLight(0xffe9c1,2);sun.position.set(10,25,15);scene.add(sun);let mat=c=>new T.MeshStandardMaterial({color:c}),green=mat(0x69a665),brown=mat(0x755038),roof=mat(0xb55a3e),white=mat(0xf8e8d5);function cube(w,h,d,m,x,y,z,g=scene){let a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);g.add(a);return a}function ball(rad,m,x,y,z,g=scene){let a=new T.Mesh(new T.SphereGeometry(rad,12,8),m);a.position.set(x,y,z);g.add(a);return a}cube(70,.2,70,green,0,-.1,0);cube(5,.08,55,mat(0xc6aa71),0,.03,0);cube(55,.08,4,mat(0xc6aa71),0,.04,0);function house(x,z,m=roof){cube(3,2.7,3,brown,x,1.35,z);let top=new T.Mesh(new T.ConeGeometry(2.8,1.9,4),m);top.position.set(x,3.4,z);top.rotation.y=Math.PI/4;scene.add(top);cube(.8,1.5,.12,mat(0x332c27),x,.8,z+1.55)}house(0,-2);house(-4,-4);house(4,-4);house(-18,-17,mat(0x458869));house(18,-17,mat(0x6678aa));house(18,17,mat(0x4c9cba));for(let i=0;i<22;i++){let x=i*17%56-28,z=i*23%53-27;if(Math.abs(x)<7||Math.hypot(x+11,z-8)<7||Object.values(towns).some(v=>Math.hypot(x-v[0],z-v[1])<6))continue;cube(.5,2,.5,brown,x,1,z);ball(1.45,mat(0x287343),x,2.8,z)}for(let a=0;a<4;a++)for(let b=0;b<4;b++){cube(1.5,.1,1.5,brown,-14+a*1.8,.02,5+b*1.8);let plant=new T.Mesh(new T.ConeGeometry(.3,.9,5),mat(0x47ad39));plant.position.set(-14+a*1.8,.55,5+b*1.8);scene.add(plant)}function figure(c){let g=new T.Group();cube(.8,1.1,.5,mat(c),0,1.3,0,g);ball(.4,white,0,2.1,0,g);cube(.25,.8,.25,mat(0x333333),-.23,.4,0,g);cube(.25,.8,.25,mat(0x333333),.23,.4,0,g);cube(.23,.75,.27,mat(c),-.58,1.4,0,g);cube(.23,.75,.27,mat(c),.58,1.4,0,g);scene.add(g);return g}let hero=figure(0x426bbb);hero.position.set(-7,0,4);let npc=[figure(0xaa7544),figure(0x9b6dae),figure(0x398875)];npc.forEach((a,i)=>a.position.set(i*3-3,0,-6));let tool=null;function look(){if(tool)hero.remove(tool);if(s.role==='Humain')tool=cube(.12,1.9,.12,mat(0xeac553),.8,1.2,0,hero);else if(s.role==='Ange'){tool=cube(2,.8,.15,white,0,1.8,-.4,hero)}else{tool=ball(.5,mat(0x52394a),0,2.65,0,hero)}}look();let enemy=null,mob=null,elapsed=0,move={x:0,z:0},cool=0,auto=0;function save(){localStorage.setItem('ledgend-save',JSON.stringify(s))}function note(t){$('note').textContent=t}function panel(html){$('card').innerHTML=html;$('modal').style.display='flex'}function close(){if(s.lvl>=5&&!s.chosen)return;$('modal').style.display='none'}function lev(n){s.xp+=n;while(s.xp>=s.lvl*7){s.xp-=s.lvl*7;s.lvl++;s.hp=40+s.lvl*2;note('Niveau '+s.lvl+' !');if(s.lvl===5&&!s.chosen){panel('<h2>Choisis ton évolution</h2><button data-role="Humain">Humain : garde ODA</button><button data-role="Ange">Ange : sorts surpuissants</button><button data-role="Loup des enfers">Loup des enfers : griffes</button>');break}}show()}function show(){$('hud').innerHTML='<b>Ledgend Village 3D</b><br>'+s.role+' · Niv '+s.lvl+' · XP '+s.xp+'/'+s.lvl*7+' · Jour '+s.day+'<br>❤️ '+s.hp+' · 🏘️ '+Math.ceil(s.village)+'/100 · Boss '+s.boss+'/10<br>🌾 '+s.grain+' 🪵 '+s.wood+' 🪨 '+s.stone+' 🪙 '+s.coins+(enemy?'<br>⚔️ '+N[s.boss]+' : '+enemy.hp+' PV':'')}show();function near(x,z,d=5){return Math.hypot(hero.position.x-x,hero.position.z-z)<d}function spawn(){if(mob||s.boss===10)return;mob=new T.Group();ball(1+s.boss*.07,mat([0x765536,0x777777,0x394b88,0x397d5b,0x885d40,0xa4afbb,0x538777,0xaa4934,0x53673b,0x4b3165][s.boss]),0,1.25,0,mob);ball(.2,mat(0xffd43b),-.4,1.4,.9,mob);ball(.2,mat(0xffd43b),.4,1.4,.9,mob);mob.position.set(0,0,-25);scene.add(mob);enemy={hp:25+s.boss*15};note('⚠️ '+N[s.boss]+' attaque le village !');show()}function damage(n){if(!mob)return;enemy.hp=Math.max(0,enemy.hp-n);if(enemy.hp===0){let name=N[s.boss];scene.remove(mob);mob=null;enemy=null;s.boss++;s.coins+=10;s.stone+=2;s.village=Math.min(100,s.village+12);lev(10+s.boss*3);note('🏆 '+name+' vaincu !'+(s.boss===10?' Victoire !':''));save()}show()}function action(){if($('modal').style.display==='flex')return;if(near(-11,8,6)){if(s.role!=='Humain')return note('ODA est réservé aux humains.');s.grain+=3;s.wood++;lev(4);note('ODA cultive : +3 céréales, +1 bois.');return}if(near(0,-2,5)){panel('<h2>Maison du village</h2><button data-do="heal">Dormir : +20 PV et jour suivant</button><button data-do="repair">Réparer : 2 bois + 1 pierre → +20 village</button><button data-do="save">Sauvegarder</button><button data-do="close">Fermer</button>');return}for(let name in towns){let t=towns[name];if(near(t[0],t[1],5)){panel('<h2>'+name+'</h2><p>Vendre 2 '+t[2]+' pour 4 pièces, ou acheter 1 '+t[3]+' pour 3 pièces.</p><button data-do="sell" data-town="'+name+'">Vendre</button><button data-do="buy" data-town="'+name+'">Acheter</button><button data-do="close">Fermer</button>');return}}note('Approche-toi du champ, de la maison ou des villages voisins.')}function attack(){if(!mob||!near(mob.position.x,mob.position.z,4.5))return note('Approche-toi du boss pour attaquer.');damage(6+Math.floor(s.lvl/2)+(s.role==='Loup des enfers'?3:0))}function magic(){if(s.role==='Humain')return action();if(s.role==='Ange'){s.village=Math.min(100,s.village+8);if(mob&&near(mob.position.x,mob.position.z,10))damage(18+Math.floor(s.lvl/2));note('Bouclier céleste lancé !')}else if(mob&&near(mob.position.x,mob.position.z,9)){hero.position.lerp(mob.position,.55);damage(13+Math.floor(s.lvl/2));note('Bond du loup !')}else note('Aucun boss assez proche.');show()}function rest(){s.day++;s.hp=Math.min(100,s.hp+15);if(s.day%2===0&&!mob&&s.lvl>=5)spawn();if(mob)s.village=Math.max(0,s.village-4);if(s.village===0){s.village=35;scene.remove(mob);mob=null;enemy=null;note('Le village a été reconstruit après une attaque.')}show();save()}$('act').onclick=action;$('hit').onclick=attack;$('magic').onclick=magic;$('rest').onclick=rest;$('card').onclick=e=>{let a=e.target.dataset;if(a.role){s.role=a.role;s.chosen=true;look();close();note('Tu es maintenant '+s.role+'.');save();show();return}if(a.do==='close')return close();if(a.do==='save'){save();note('Partie sauvegardée.');return}if(a.do==='heal'){rest();close();return}if(a.do==='repair'){if(s.wood<2||s.stone<1)return note('Il faut 2 bois et 1 pierre.');s.wood-=2;s.stone--;s.village=Math.min(100,s.village+20)}if(a.do==='sell'||a.do==='buy'){let t=towns[a.town];if(a.do==='sell'){if(s[t[2]]<2)return note('Ressources insuffisantes.');s[t[2]]-=2;s.coins+=4}else{if(s.coins<3)return note('Pièces insuffisantes.');s.coins-=3;s[t[3]]++}}close();show();save()};let pad=$('pad'),nub=$('nub');function aim(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,z=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(x,z));move.x=x/l*Math.min(1,l/40);move.z=z/l*Math.min(1,l/40);nub.style.transform='translate('+move.x*38+'px,'+move.z*38+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);aim(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))aim(e)};pad.onpointerup=pad.onpointercancel=()=>{move.x=move.z=0;nub.style.transform=''};let k={};onkeydown=e=>{k[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')action();if(e.key===' ')attack();if(e.key.toLowerCase()==='q')magic()};onkeyup=e=>k[e.key.toLowerCase()]=false;let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if($('modal').style.display!=='flex'){let x=move.x+(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),z=move.z+(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0),length=Math.hypot(x,z);if(length>.1){hero.position.x=Math.max(-29,Math.min(29,hero.position.x+x/Math.max(1,length)*dt*8));hero.position.z=Math.max(-29,Math.min(29,hero.position.z+z/Math.max(1,length)*dt*8));hero.rotation.y=Math.atan2(x,z)}elapsed+=dt;if(elapsed>35&&s.lvl>=5){elapsed=0;s.day++;if(!mob)spawn();save();show()}if(mob){let delta=new T.Vector3().subVectors(new T.Vector3(0,0,0),mob.position),d=delta.length();if(d>3)mob.position.addScaledVector(delta.normalize(),dt*(1.7+s.boss*.1));else{s.village-=dt*2;if(s.village<=0){s.village=35;mob.position.set(0,0,-25);note('Village endommagé !')}show()}if(hero.position.distanceTo(mob.position)<2.2){cool-=dt;if(cool<=0){s.hp=Math.max(0,s.hp-3);cool=1;if(!s.hp){s.hp=30;hero.position.set(-7,0,4);note('Tu te réveilles au village.')}show()}}}}camera.position.lerp(new T.Vector3(hero.position.x,16,hero.position.z+20),Math.min(1,dt*4));camera.lookAt(hero.position.x,1,hero.position.z-3);r.render(scene,camera)}requestAnimationFrame(frame);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></html>
